# ==============================================================================
# Indic Voice RAG — production stack (Oracle VM: 2 OCPU / 12 GB / 100 GB disk)
# ==============================================================================
#
# WHY TWO SERVICES
# ----------------
# The backend previously opened the index with QdrantClient(path=...), i.e.
# qdrant-client's local file mode. Measured on the real 680,446-vector index:
#
#     retrieval p50 = 11,411 ms      p100 = 26,744 ms
#     startup       = 75 minutes
#
# Local mode does brute-force NumPy search, ignores hnsw_config and
# quantization_config entirely, holds every vector in RAM, and allows only one
# process. A real Qdrant server builds an HNSW index, honours int8 quantization,
# memory-maps vectors from disk, and serves many clients.
#
# USAGE
# -----
#   cp .env.example backend/.env      # then fill in the keys
#   docker compose up -d
#   docker compose logs -f backend
#
# Restore the index snapshot built by backend/build_index_gpu.py:
#   curl -X POST "http://localhost:6333/collections/indic_rag_msmarco_hi/snapshots/upload?priority=snapshot" \
#        -H "api-key: $QDRANT_API_KEY" -F "snapshot=@/path/to/your.snapshot"

name: indic-voice-rag

services:

  qdrant:
    image: qdrant/qdrant:v1.12.4          # MUST match BuildConfig.qdrant_version
    container_name: rag-qdrant
    restart: unless-stopped

    # NOT published to 0.0.0.0. Qdrant has no auth by default and a public
    # instance is a full read/write database open to the internet. The backend
    # reaches it over the internal compose network; the host binding below is
    # loopback-only, for SSH-tunnelled debugging and for running benchmark.py
    # on the VM itself.
    ports:
      - "127.0.0.1:6333:6333"             # HTTP / dashboard
      - "127.0.0.1:6334:6334"             # gRPC

    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      QDRANT__LOG_LEVEL: INFO

      # 2 OCPU total and the backend needs one. Letting Qdrant spawn a thread per
      # core starves the encoder and makes embed_query slower than the search it
      # was meant to speed up.
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 2
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: 1

      # Force segments above 32 MB to be memory-mapped instead of RAM-resident.
      # This is what bounds memory as the corpus grows: only the int8 quantized
      # copies stay hot, originals are paged in from disk on demand.
      QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD_KB: 32768
      QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD_KB: 20000

      QDRANT__SERVICE__ENABLE_TLS: "false"   # loopback + internal network only
      QDRANT__TELEMETRY_DISABLED: "true"

    healthcheck:
      # A bare TCP connect, NOT /readyz: the qdrant image ships no curl or wget.
      # This therefore only proves the port is bound, not that collections are
      # loaded, so `depends_on: service_healthy` is a weaker gate than it looks.
      # The real readiness wait lives in entrypoint.sh, which polls
      # ${QDRANT_URL}/readyz from the backend container (which does have curl)
      # and refuses to start the app until it answers. Do not rely on this
      # healthcheck alone for ordering.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s                  # large collections take time to open

    deploy:
      resources:
        limits:
          memory: 7G                      # of 12G; leaves room for backend + OS
        reservations:
          memory: 1G

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped

    depends_on:
      qdrant:
        condition: service_healthy        # never start against a half-open index

    ports:
      # HOST_PORT lets the new stack run alongside an existing deployment that
      # already binds 3004, so it can be verified before the tunnel is switched
      # over and the old service removed. Container port stays 3004.
      - "${HOST_PORT:-3004}:3004"

    # NOTE: there is deliberately no `env_file:` here. backend/.env is gitignored,
    # so it does not exist in a git clone and compose fails outright with
    # "env file ... not found". Every variable the app needs is listed explicitly
    # below and substituted from the .env that Dokploy writes next to this file
    # (or from the shell, for a plain `docker compose up`).
    environment:
      # Transport is pinned here rather than left to env: the manifest records
      # which transport built the index, and retriever.py raises
      # IndexUnavailableError on a mismatch — it cannot silently fall back.
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      QDRANT_PREFER_GRPC: "true"
      QDRANT_TIMEOUT_S: "10"
      # Retrieval tuning. HNSW_EF was hardcoded, so tuning it needed a commit
      # and redeploy; all of these are substituted from the environment now so
      # they can be A/B'd from the Dokploy env panel against benchmark.py's
      # answer_recall_mean without another deploy.
      #
      # HNSW_EF=64 was tried on the theory that visiting fewer graph nodes
      # would cut the memory-latency cost that dominates retrieval here. It
      # did NOT: measured over 30 queries, ef=128 came out at 207ms mean and
      # ef=64 at 220ms, i.e. no better and possibly slightly worse. Its recall
      # cost is still unmeasured, because the benchmark was sampling a
      # different query set every run at the time (fixed alongside this).
      # The deployment therefore sets HNSW_EF=128 in the env panel; this
      # default is left at 64 only so the value stays overridable rather than
      # hardcoded. Prefer 128 until someone measures otherwise.
      HNSW_EF: ${HNSW_EF:-64}
      CANDIDATE_LIMIT: ${CANDIDATE_LIMIT:-0}
      SPARSE_MODE: ${SPARSE_MODE:-on}
      SPARSE_SKIP_SCORE: ${SPARSE_SKIP_SCORE:-0.90}
      QUANT_RESCORE: ${QUANT_RESCORE:-true}

      PORT: "3004"
      PYTHONUNBUFFERED: "1"

      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_LLM_MODEL: ${SARVAM_LLM_MODEL:-sarvam-105b-conversations}
      SARVAM_REASONING_EFFORT: ${SARVAM_REASONING_EFFORT:-none}
      SARVAM_MODEL: ${SARVAM_MODEL:-saarika:v2.5}

      # Realtime STT (stt_realtime.py) — the live transcript stream. Exposed as
      # env rather than left to the module defaults specifically because the
      # realtime wire format is still being confirmed against the live API: a
      # correction here is an env change and a restart, not a rebuild of an
      # image on a VM measured at ~100 kB/s to PyPI.
      SARVAM_STT_WS_URL: ${SARVAM_STT_WS_URL:-wss://api.sarvam.ai/speech-to-text-realtime/ws}
      SARVAM_STT_REALTIME_MODEL: ${SARVAM_STT_REALTIME_MODEL:-saaras:v3-realtime}

      # 0.80 was the placeholder before the index existed to calibrate against.
      # calibrate_threshold.py against the live 680k-vector index (2026-08-19)
      # found real-query and out-of-domain scores overlap heavily (E5 cosine is
      # compressed into a narrow high band), and recommended 0.850 as the
      # coverage-first value: answers 95.7% of real queries while actually
      # refusing some out-of-domain ones, instead of 0.80's 100%/100%.
      MIN_RETRIEVAL_SCORE: ${MIN_RETRIEVAL_SCORE:-0.850}

      # Relative-margin gate (retriever.py score_margin): does the top passage
      # stand out from the field, or is everything similarly mediocre? Added
      # because MIN_RETRIEVAL_SCORE alone barely separates real from
      # out-of-domain queries on this index (both cluster ~0.87-0.90 cosine).
      # 0.0 is a no-op — margin is never negative, so this check always passes
      # until calibrated. Calibrate with calibrate_threshold.py before raising it.
      MIN_SCORE_MARGIN: ${MIN_SCORE_MARGIN:-0.0}
      MIN_GROUNDING_OVERLAP: ${MIN_GROUNDING_OVERLAP:-0.45}
      MAX_TOKENS: ${MAX_TOKENS:-48}
      LLM_ATTEMPTS: ${LLM_ATTEMPTS:-3}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-6.0}

      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # Every question asked and answer given, with the full latency
      # breakdown -- backs the public Insights page. Deliberately writable
      # and on its own named volume, separate from the :ro index files below:
      # this file is created and grown by the running app, not shipped data.
      QUERY_LOG_PATH: ${QUERY_LOG_PATH:-/app/backend/query_log/query_log.sqlite}

    volumes:
      # parents.sqlite (281MB) and index_manifest.json are gitignored, so they are
      # NOT in a git clone — they ship alongside the Qdrant snapshot and are placed
      # on the host out of band.
      #
      # INDEX_DIR makes the source location configurable because the two
      # deployment styles need different paths:
      #   plain docker compose : ./backend        (files sit next to the code)
      #   Dokploy             : ../files          (Dokploy's persistent bind-mount
      #                                            dir; the git clone is REPLACED on
      #                                            every deploy, and Dokploy warns
      #                                            that absolute host paths are
      #                                            cleaned up during deployment)
      #
      # Confirm the resolved host path in Dokploy's UI under Advanced > Volumes —
      # the docs do not state it and it must not be guessed.
      - ${INDEX_DIR:-./backend}/parents.sqlite:/app/backend/parents.sqlite:ro
      - ${INDEX_DIR:-./backend}/index_manifest.json:/app/backend/index_manifest.json:ro
      - query_log_data:/app/backend/query_log

    healthcheck:
      # /health returns 503 when the index is unusable, so an unhealthy container
      # is a real signal rather than "process is alive".
      test: ["CMD-SHELL", "curl -fsS http://localhost:3004/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 4G

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  qdrant_storage:
  qdrant_snapshots:
  query_log_data:
